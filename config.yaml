broker:
  name: alpaca
  starting_cash: 10000
  slippage_bps: 5
universe:
  dynamic: true
  max_tickers: 10
  max_sectors: 2
  method: sector_intelligence
  gemini_sector_call: true
  stock_rank_by: volume_atr
  fallback_tickers:
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMD
  - META
  - GOOGL
  - AMZN
  - SPY
  - QQQ
data:
  provider: alpaca
  feed: iex          # iex = free/paper  |  sip = live account (Algo Trader Plus)
  bar_interval: 1m
  lookback_days: 10
signals:
  weights:
    technical: 0.30
    sentiment: 0.10
    fundamental: 0.10
    ml: 0.05
    finrl: 0.10
    orb: 0.10
    vwap_bounce: 0.25
  entry_persistence_bars: 2
  relative_strength_min: -0.001
  rs_lookback_bars: 6
  enter_long_threshold: 0.45
  enter_short_threshold: -0.45
  exit_threshold: 0.15
  min_confidence: 0.50
  require_ml_finrl_agreement: false  # disabled — over-filters winners without quality gain
  technical:
    rsi_period: 45
    rsi_oversold: 35
    rsi_overbought: 65
    macd_fast: 40
    macd_slow: 105
    macd_signal: 25
    bb_period: 100
    bb_std: 2.0
    ema_short: 45
    ema_long: 105
    use_vwap: true
    atr_period: 70
  sentiment:
    sources:
    - newsapi
    - finnhub
    max_age_minutes: 120
    model: vader
  fundamental:
    sec_filing_types:
    - 8-K
    - 10-Q
    - 10-K
    - '4'
    earnings_window_days: 3
    lookback_hours: 48
  ml:
    mode: local                    # local (free) | llm | hybrid
    model_path: models/local_lgbm.pkl
    retrain_days: 7
    prediction_horizon_minutes: 45
    label_method: fixed            # fixed (direction) | triple_barrier (TP-before-SL)
    tp_barrier_pct: 0.004          # take-profit barrier for triple-barrier labels
    sl_barrier_pct: 0.003          # stop-loss barrier for triple-barrier labels
    min_confidence: 0.55
    tech_threshold: 0.10           # lowered: local model is free, no need to gate tightly
    max_daily_calls: 5             # LLM calls/day cap (ignored in local mode)
    max_calls_per_cycle: 1         # LLM calls/cycle cap (ignored in local mode)
  orb:
    orb_minutes: 15
    volume_confirmation_mult: 1.3
    decay_start_minutes: 120
    decay_end_minutes: 240
  vwap_bounce:
    proximity_pct: 0.003
    vol_decline_thresh: 0.85
    vol_surge_thresh: 1.3
    approach_bars: 15
  finrl:
    model_path: models/finrl_ppo.zip
    retrain_days: 1               # retrain every trading day (incremental — keeps prior knowledge)
    min_confidence: 0.40          # lower than ML: RL needs more steps to reach high conviction
    tech_threshold: 0.10          # lowered: run inference on all meaningful symbols
    total_timesteps: 200000       # PPO steps for initial full train
    daily_timesteps: 50000        # PPO steps for each daily incremental update (faster ~30s GPU)
    device: auto                  # auto | cpu | cuda
regime:
  adx_trend_thresh: 25    # ADX must reach 25+ to route exits as TRENDING (let winners run)
  adx_choppy_thresh: 20   # ADX below 20 = CHOPPY (partial profit + EOD flatten)
risk:
  max_position_pct: 0.1
  max_total_exposure_pct: 0.8
  max_concurrent_positions: 11
  daily_loss_limit_pct: 0.03
  per_trade_stop_loss_pct: 0.025
  take_profit_pct: 0.06
  trailing_stop_pct: 0.030000000000000002
  breakeven_trigger_pct: 0.022
  use_atr_stops: true
  atr_stop_multiplier: 13.0
  atr_tp_multiplier: 4.0
  shorting_enabled: false
  short_regimes:
  - trending_bear
  - high_volatility
  pdt_protection: true
  kelly_fraction: 0.25
  min_hold_minutes: 45
  max_hold_minutes: 480          # full trading session (was 180 — was clipping intraday winners)
  partial_profit_1_pct: 0.01
  partial_profit_2_pct: 0.025
  stale_exit_minutes: 15
  stale_exit_threshold_pct: 0.003
  time_decay_tp_enabled: true
  time_decay_tp_start_minutes: 45
  time_decay_tp_full_minutes: 120
  time_decay_tp_min_pct: 0.015
  max_symbol_daily_losses: 2
  min_entry_adx: 18                   # block entries when symbol ADX < this (no trend = noise)
  weak_trend_adx_max: 25             # ADX in [min_entry_adx, this] = weak-trend zone
  weak_trend_entry_threshold: 0.55   # min score required to enter in weak-trend zone
  weak_trend_max_daily_losses: 1     # loss cap per day for weak-trend symbols (vs 2 normally)
  dynamic_exclusion_win_rate: 0.30    # daily win rate threshold for bad-day detection
  dynamic_exclusion_streak_days: 3    # consecutive bad days before symbol is excluded
  max_positions_per_sector: 3
  use_daily_trend_filter: true
schedule:
  poll_seconds: 60
  market_open_buffer_minutes: 30
  market_close_buffer_minutes: 10
  trade_only_market_hours: true
  no_entry_before_close_minutes: 5    # EOD flush at close, not 30 min early
  no_trade_window_start: '11:30'
  no_trade_window_end: '14:00'
notifications:
  on_trade: true
  on_kill_switch: true
  channels:
  - console
  - discord
  - email
