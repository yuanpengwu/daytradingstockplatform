broker:
  name: alpaca
  starting_cash: 10000
  slippage_bps: 5
universe:
  dynamic: true
  max_tickers: 10
  max_sectors: 2
  method: sector_intelligence
  gemini_sector_call: true
  stock_rank_by: volume_atr
  fallback_tickers:
  - AAPL
  - MSFT
  - NVDA
  - TSLA
  - AMD
  - META
  - GOOGL
  - AMZN
  - SPY
  - QQQ
data:
  provider: alpaca
  bar_interval: 5m
  lookback_days: 30
signals:
  weights:
    technical: 0.3
    sentiment: 0.1
    fundamental: 0.1
    ml: 0.15
    orb: 0.2
    vwap_bounce: 0.15
  entry_persistence_bars: 2
  relative_strength_min: -0.001
  rs_lookback_bars: 6
  enter_long_threshold: 0.5
  enter_short_threshold: -0.5
  exit_threshold: 0.25
  min_confidence: 0.55
  technical:
    rsi_period: 9
    rsi_oversold: 35
    rsi_overbought: 65
    macd_fast: 8
    macd_slow: 21
    macd_signal: 5
    bb_period: 20
    bb_std: 2.0
    ema_short: 9
    ema_long: 21
    use_vwap: true
    atr_period: 14
  sentiment:
    sources:
    - newsapi
    - finnhub
    max_age_minutes: 120
    model: vader
  fundamental:
    sec_filing_types:
    - 8-K
    - 10-Q
    - 10-K
    - '4'
    earnings_window_days: 3
    lookback_hours: 48
  ml:
    model_path: models/xgb_intraday.joblib
    retrain_on_startup: false
    prediction_horizon_minutes: 45
    min_confidence: 0.55
    tech_threshold: 0.3
    max_daily_calls: 80
    max_calls_per_cycle: 3
  orb:
    orb_minutes: 15
    volume_confirmation_mult: 1.3
    decay_start_minutes: 120
    decay_end_minutes: 240
  vwap_bounce:
    proximity_pct: 0.003
    vol_decline_thresh: 0.85
    vol_surge_thresh: 1.3
    approach_bars: 3
risk:
  max_position_pct: 0.1
  max_total_exposure_pct: 0.8
  max_concurrent_positions: 11
  daily_loss_limit_pct: 0.03
  per_trade_stop_loss_pct: 0.025
  take_profit_pct: 0.06
  trailing_stop_pct: 0.030000000000000002
  breakeven_trigger_pct: 0.022
  use_atr_stops: true
  atr_stop_multiplier: 13.0
  atr_tp_multiplier: 4.0
  shorting_enabled: false
  pdt_protection: true
  kelly_fraction: 0.25
  min_hold_minutes: 30
  partial_profit_1_pct: 0.01
  partial_profit_2_pct: 0.025
  stale_exit_minutes: 20
  stale_exit_threshold_pct: 0.003
  max_symbol_daily_losses: 2
  max_positions_per_sector: 3
  use_daily_trend_filter: true
schedule:
  poll_seconds: 60
  market_open_buffer_minutes: 30
  market_close_buffer_minutes: 10
  trade_only_market_hours: true
  no_entry_before_close_minutes: 30
  no_trade_window_start: '11:30'
  no_trade_window_end: '14:00'
notifications:
  on_trade: true
  on_kill_switch: true
  channels:
  - console
  - discord
  - email
